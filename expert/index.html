<script>

(function(){

  if(!el) return;
  const d=new Date(document.lastModified);
  if(!Number.isNaN(d.getTime())){
    el.textContent='Last updated · '+new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  }
})();
