document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{const el=document.getElementById(btn.dataset.copy);try{await navigator.clipboard.writeText(el.innerText.trim());const t=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=t,1000)}catch(e){alert('복사할 수 없습니다.')}}));


(function(){
  const toast = document.createElement('div');
  toast.className='url-toast'; toast.id='urlToast'; toast.textContent='복사했어요';
  document.body.appendChild(toast);

  function notify(msg){
    toast.textContent=msg; toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),1200);
  }
  window.dsNotify = notify;

  document.querySelectorAll('[data-copy-url]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(location.href);
        notify('현재 페이지 URL을 복사했어요');
      }catch(e){ notify('URL 복사에 실패했어요'); }
    });
  });

  document.querySelectorAll('[data-tabs]').forEach(tabset=>{
    const buttons=[...tabset.querySelectorAll('.tab-btn')];
    const panels=[...tabset.parentElement.querySelectorAll('.tab-panel')];
    buttons.forEach(btn=>btn.addEventListener('click',()=>{
      buttons.forEach(b=>b.classList.remove('active'));
      panels.forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      const p=document.getElementById(btn.dataset.tab);
      if(p) p.classList.add('active');
    }));
  });

  const searchInput=document.getElementById('dsSearch');
  const results=document.getElementById('dsSearchResults');
  if(searchInput && results){
    const items=[
      ['Foundations','foundations.html'],['Typography','typography.html'],['Color','color.html'],
      ['Spacing','spacing.html'],['Radius','radius.html'],['Components','components.html'],
      ['Button','button.html'],['Input','input.html'],['Checkbox','checkbox.html'],['Badge','badge.html'],['Card','card.html'],
      ['Patterns','patterns.html'],['Form','form.html'],['Navigation','navigation.html'],['Empty State','empty-state.html'],
      ['Templates','templates.html'],['Form Grid','form-grid.html'],['Modal','modal.html'],
      ['AI Guide','ai-guide.html'],['Usage Guide','usage-guide.html'],['llms.txt','llms-guide.html'],['Claude Code Skill','claude-skill.html']
    ];
    function render(q){
      q=q.trim().toLowerCase();
      if(!q){results.classList.remove('show');results.innerHTML='';return;}
      const found=items.filter(([n])=>n.toLowerCase().includes(q)).slice(0,8);
      results.innerHTML=found.map(([n,u])=>`<a href="${u}">${n}</a>`).join('');
      results.classList.toggle('show',found.length>0);
    }
    searchInput.addEventListener('input',e=>render(e.target.value));
  }
})();
